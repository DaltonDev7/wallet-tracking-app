<p-dialog
  [visible]="true"
  [modal]="true"
  [closable]="false"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="true"
  [style]="{ width: 'min(92vw, 28rem)' }"
  contentStyleClass="pt-2">
  <ng-template pTemplate="header">
    <div class="flex items-center gap-3">
      <div
        class="flex h-10 w-10 items-center justify-center rounded-2xl"
        [ngClass]="danger ? 'bg-red-100 text-red-600' : 'bg-primary-100 text-primary-700'">
        <i class="pi" [ngClass]="danger ? 'pi-exclamation-triangle' : 'pi-question-circle'"></i>
      </div>
      <div>
        <h2 class="text-base font-semibold text-color-emphasis">{{ title }}</h2>
        <p class="text-sm text-muted-color">Confirma para continuar.</p>
      </div>
    </div>
  </ng-template>

  <p class="m-0 text-sm leading-6 text-muted-color">
    {{ message }}
  </p>

  <ng-template pTemplate="footer">
    <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
      <button
        pButton
        type="button"
        severity="secondary"
        variant="text"
        [label]="cancelLabel"
        (click)="onCancel()"></button>

      <button
        pButton
        type="button"
        [severity]="danger ? 'danger' : 'primary'"
        [label]="confirmLabel"
        (click)="onConfirm()"></button>
    </div>
  </ng-template>
</p-dialog>
