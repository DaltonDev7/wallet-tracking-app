<p-menubar [model]="menuItems()" styleClass="border-bottom bg-white">

  <ng-template pTemplate="start">
    <div class="logo" routerLink="/">
      <div class="logo-badge">WT</div>
      <span class="logo-text">Wallet Tracking</span>
    </div>
  </ng-template>

  <ng-template pTemplate="end">
    <div class="right">

      @if (user()) {
        <div class="hidden-md-down">
          <button
            pButton
            type="button"
            class="user-btn"
            (click)="openUserMenu($event)"
          >
            @if (user()?.photoURL) {
              <p-avatar
                [image]="user()!.photoURL!"
                shape="circle">
              </p-avatar>
            } @else {
              <p-avatar
                [label]="displayInitial()"
                shape="circle">
              </p-avatar>
            }

            <span class="user-name">{{ user()?.displayName || 'Usuario' }}</span>
            <i class="pi pi-angle-down"></i>
          </button>

          <p-tieredMenu #userMenu [model]="userItems()" [popup]="true"></p-tieredMenu>
        </div>
      }

      <button
        pButton
        type="button"
        icon="pi pi-bars"
        class="mobile-btn hidden-md-up"
        (click)="toggleMobile()"
      ></button>
    </div>
  </ng-template>

</p-menubar>

<!-- Drawer -->
<p-drawer
  [visible]="mobileOpen"
 
  position="right"
  [dismissible]="true"
  [blockScroll]="true"
  styleClass="mobile-drawer"
>
  <div class="mobile-nav">
    <a routerLink="/" (click)="closeMobile()" class="mobile-link">Inicio</a>
    <a routerLink="/income" (click)="closeMobile()" class="mobile-link">Ingresos</a>
    <a routerLink="/expenses" (click)="closeMobile()" class="mobile-link">Gastos</a>
    <a routerLink="/categories" (click)="closeMobile()" class="mobile-link">Categorías</a>

    <hr class="sep" />

    <div class="mobile-user">
      @if (user()?.photoURL) {
        <p-avatar [image]="user()!.photoURL!" shape="circle"></p-avatar>
      } @else {
        <p-avatar [label]="displayInitial()" shape="circle"></p-avatar>
      }

      <span class="mobile-name">{{ user()?.displayName || 'Usuario' }}</span>
    </div>

    <button
      pButton
      type="button"
      icon="pi pi-sign-out"
      label="Cerrar sesión"
      class="logout-btn"
      (click)="onLogout()"
    ></button>
  </div>
</p-drawer>
